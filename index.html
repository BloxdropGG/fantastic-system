<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Soravia Ticket System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    text-align: center;
}

input, select, textarea {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    width: 220px;
}

button {
    padding: 8px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin: 5px;
}

.ticket {
    margin-top: 20px;
    padding: 15px;
    width: 320px;
    border-radius: 12px;
    display: inline-block;
    text-align: left;
    position: relative;
}

.vip { background: gold; color: black; }
.economy { background: #2a5298; }
.military { background: #355c3a; }

.tab { display: none; }
.active { display: block; }

.auth-box {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.1);
    display: inline-block;
    border-radius: 12px;
}
</style>
</head>

<body>

<h1>🎫 Soravia Ticket System</h1>

<!-- AUTH SECTION -->
<div id="authSection" class="auth-box">
    <h2>🔐 Admin Login / Register</h2>

    <input id="authUser" placeholder="Username"><br>
    <input id="authPass" type="password" placeholder="Password"><br>

    <button onclick="registerAdmin()">Register</button>
    <button onclick="loginAdmin()">Login</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">

<button onclick="showTab('user')">User Panel</button>
<button onclick="showTab('admin')">Admin Panel</button>
<button onclick="logout()">Logout</button>

<!-- USER -->
<div id="user" class="active">

<input id="name" placeholder="Name"><br>
<input id="datetime" type="datetime-local"><br>
<input id="location" placeholder="Location"><br>

<select id="style">
    <option value="economy">Economy</option>
    <option value="vip">VIP</option>
    <option value="military">Military</option>
</select><br>

<input id="org" placeholder="Organization"><br>
<textarea id="desc" placeholder="Description"></textarea><br>

<button onclick="generateTicket()">Generate Ticket</button>

<div id="ticketOutput"></div>

</div>

<!-- ADMIN -->
<div id="admin" class="tab">
<h2>🛠 Admin Panel</h2>
<div id="adminList"></div>
</div>

</div>

<script>
let tickets = JSON.parse(localStorage.getItem("tickets")) || [];
let admins = JSON.parse(localStorage.getItem("admins")) || [];
let currentAdmin = JSON.parse(localStorage.getItem("currentAdmin")) || null;

// init
if (currentAdmin) {
    document.getElementById("authSection").style.display = "none";
    document.getElementById("app").style.display = "block";
}

// prevent past time
document.getElementById("datetime").min =
    new Date().toISOString().slice(0,16);

function saveAll() {
    localStorage.setItem("tickets", JSON.stringify(tickets));
    localStorage.setItem("admins", JSON.stringify(admins));
    localStorage.setItem("currentAdmin", JSON.stringify(currentAdmin));
}

/* AUTH */
function registerAdmin() {
    const u = document.getElementById("authUser").value;
    const p = document.getElementById("authPass").value;

    if (!u || !p) return alert("Fill all fields");

    if (admins.find(a => a.user === u)) {
        return alert("User already exists");
    }

    admins.push({ user: u, pass: p });
    saveAll();

    alert("Registered successfully");
}

function loginAdmin() {
    const u = document.getElementById("authUser").value;
    const p = document.getElementById("authPass").value;

    const admin = admins.find(a => a.user === u && a.pass === p);

    if (!admin) return alert("Invalid login");

    currentAdmin = admin;
    saveAll();

    document.getElementById("authSection").style.display = "none";
    document.getElementById("app").style.display = "block";
}

function logout() {
    currentAdmin = null;
    localStorage.removeItem("currentAdmin");
    location.reload();
}

/* APP */
function showTab(tab) {
    if (!currentAdmin) return alert("Login required");

    document.getElementById("user").classList.remove("active");
    document.getElementById("admin").classList.remove("active");
    document.getElementById(tab).classList.add("active");
}

function generateTicket() {
    const name = document.getElementById("name").value;
    const datetime = document.getElementById("datetime").value;
    const location = document.getElementById("location").value;
    const style = document.getElementById("style").value;
    const org = document.getElementById("org").value;
    const desc = document.getElementById("desc").value;

    if (!name || !datetime || !location) return alert("Fill required");

    const ticket = {
        id: Date.now(),
        name, datetime, location,
        style, org, desc,
        status: "Pending"
    };

    tickets.push(ticket);
    saveAll();

    renderTicket(ticket);
    renderAdmin();
}

function renderTicket(ticket) {
    const div = document.createElement("div");
    div.className = `ticket ${ticket.style}`;

    div.innerHTML = `
        <h3>🎫 #${ticket.id}</h3>
        <p>${ticket.name}</p>
        <p>${ticket.location}</p>
        <p>${new Date(ticket.datetime).toLocaleString()}</p>
        <p>Status: ${ticket.status}</p>
        <div id="qr-${ticket.id}"></div>
    `;

    document.getElementById("ticketOutput").appendChild(div);

    new QRCode(document.getElementById(`qr-${ticket.id}`), {
        text: JSON.stringify(ticket),
        width: 100,
        height: 100
    });
}

function renderAdmin() {
    if (!currentAdmin) return;

    const div = document.getElementById("adminList");
    div.innerHTML = "";

    tickets.forEach(t => {
        const el = document.createElement("div");

        el.innerHTML = `
            <p>🎫 ${t.name} (${t.status})</p>
            <button onclick="updateStatus(${t.id}, 'Approved')">Approve</button>
            <button onclick="updateStatus(${t.id}, 'Rejected')">Reject</button>
            <hr>
        `;

        div.appendChild(el);
    });
}

function updateStatus(id, status) {
    const t = tickets.find(x => x.id === id);
    if (t) t.status = status;

    saveAll();
    renderAdmin();
}
</script>

</body>
</html>
